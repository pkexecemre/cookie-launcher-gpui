[workspace]
# xtask yalnızca yerel bir yardımcı; depoda izlenmiyor.
exclude = ["xtask"]

[package]
name = "cookie-launcher-gpui"
version = "4.0.0"
edition = "2021"
description = "Cookie Launcher — native GPUI client for the Cookie Launcher Python core"

[dependencies]
zip = { version = "2.4", default-features = false, features = ["deflate"] }
gpui-kit = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
hmac = "0.12"
sha2 = "0.10"
ureq = "3"
socket2 = "0.6"
anyhow = "1"

[dev-dependencies]
# Enables the headless test platform and key simulation. Same source and
# version as the normal dependency, so nothing new enters the graph.
gpui_test = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
